# Checks that run without the GA4 data (which isn't in the repo): unit tests and that the dbt project compiles.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: dbt project compiles
        working-directory: sql
        run: dbt parse --profiles-dir .

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("testthat")'
      - name: R unit tests
        run: Rscript -e "testthat::test_dir('r/tests', stop_on_failure = TRUE)"
