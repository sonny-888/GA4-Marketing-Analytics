[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-analytics"
version = "0.1.0"
description = "End-to-end marketing analytics on the GA4 sample e-commerce dataset"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.1",
    "pyarrow>=16",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
extract = ["google-cloud-bigquery[bqstorage,pandas]>=3.25", "pydata-google-auth>=1.8"]
dev = ["pytest>=8", "ipykernel>=6", "nbconvert>=7", "jsonschema>=4.21", "requests>=2.31"]
mmm = ["nevergrad>=1.0"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
