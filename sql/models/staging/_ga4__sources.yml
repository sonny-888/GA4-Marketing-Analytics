version: 2

sources:
  - name: ga4
    description: >
      GA4 obfuscated sample e-commerce export (Google Merchandise Store, 2020-11-01 to 2021-01-31),
      extracted from bigquery-public-data.ga4_obfuscated_sample_ecommerce by python/scripts/ga4_extract.py.
    meta:
      external_location: "read_parquet('{{ var(\"ga4_raw_path\") }}', hive_partitioning = false)"
    tables:
      - name: events
        description: One row per GA4 event, nested schema exactly as exported from BigQuery.
